name: Release

# Publishes a download that anyone can use, without a GitHub account. A release is made for the Version in
# Directory.Build.props when that version has no release yet: when such a commit reaches main, when a tag
# v<Version> is pushed, or when the workflow is started by hand from the Actions page. The executable is only
# published after every automated test, the executable's self-test and the UI smoke test have passed on Windows.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time, so two runs can never race to publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Decide whether this version needs a release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          if [ -z "$version" ]; then echo "::error::Directory.Build.props has no Version."; exit 1; fi
          tag="v$version"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag '$REF_NAME' does not match Version '$version' in Directory.Build.props."; exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $version has no release yet; it will be built, verified and published."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Build, verify and publish the release
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      TAG: ${{ needs.check.outputs.tag }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build, test, publish, self-test and UI smoke test
        run: ./scripts/build.ps1 -SmokeUi

      - name: Write the release notes
        run: |
          $version = $env:TAG.TrimStart('v')
          $hash = ((Get-Content artifacts/publish/MinecraftCleanerPro.exe.sha256 -Raw).Trim() -split '\s+')[0]
          $notes = (Get-Content docs/RELEASE-NOTES.md -Raw) -replace "`r`n", "`n"
          $start = $notes.IndexOf("`n## $version")
          if ($start -lt 0) { throw "docs/RELEASE-NOTES.md has no section for $version." }
          $next = $notes.IndexOf("`n## ", $start + 1)
          $section = if ($next -lt 0) { $notes.Substring($start) } else { $notes.Substring($start, $next - $start) }
          $section = ($section.Trim() -split "`n", 2)[1].Trim()
          $template = @'
          ## Download

          **[Download MinecraftCleanerPro.exe]({{URL}})** for Windows 10 and 11 (64-bit). No installation and no .NET download needed; just run it.

          - SHA-256: `{{HASH}}` (in PowerShell: `Get-FileHash .\MinecraftCleanerPro.exe`)
          - The program is **not code-signed**, so Windows SmartScreen shows "Windows protected your PC". Click **More info**, then **Run anyway**.
          - Built from the source code in this repository and tested on Windows by GitHub Actions before it was published: [build log]({{RUN}}).
          - It works offline, never needs administrator rights, and only removes files after you confirm them. Quarantined files can be restored.

          ## What's new

          {{SECTION}}
          '@
          $body = ($template -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $body = $body.Replace('{{URL}}', "https://github.com/$env:REPOSITORY/releases/download/$env:TAG/MinecraftCleanerPro.exe").Replace('{{HASH}}', $hash).Replace('{{RUN}}', $env:RUN_URL).Replace('{{SECTION}}', $section)
          Set-Content -Path artifacts/release-notes.md -Value $body -Encoding utf8
          Get-Content artifacts/release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.TrimStart('v')
          # Creates the tag on the tested commit, or uses the tag that was pushed.
          gh release create $env:TAG artifacts/publish/MinecraftCleanerPro.exe artifacts/publish/MinecraftCleanerPro.exe.sha256 `
            --target $env:GITHUB_SHA --title "Minecraft Cleaner Pro $version" --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Creating the release failed." }

      - name: Keep the verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            artifacts/publish/MinecraftCleanerPro.exe.sha256
            artifacts/selftest.json
            artifacts/smoke-ui.log
            artifacts/release-notes.md
            artifacts/TestResults/**
          if-no-files-found: warn
